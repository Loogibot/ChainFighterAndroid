        }
        release {
        }
    }
    compileSdk 37

    defaultConfig {
        applicationId "com.loogibot.chainfighter"
        minSdk 23
        //noinspection OldTargetApi
        targetSdk 36
        versionCode 4
        versionName "4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
